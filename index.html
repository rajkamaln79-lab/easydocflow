<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Easydocflow - Document & PDF Suite</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@400;600;700&display=swap" rel="stylesheet">
    <script>
      (function() {
        try {
          var proto = window;
          var desc = Object.getOwnPropertyDescriptor(proto, 'fetch');
          while (!desc && proto) {
            proto = Object.getPrototypeOf(proto);
            if (proto) desc = Object.getOwnPropertyDescriptor(proto, 'fetch');
          }
          if (desc && (!desc.writable || !desc.set)) {
            var _fetch = window.fetch;
            Object.defineProperty(window, 'fetch', {
              get: function() { return _fetch; },
              set: function(val) { _fetch = val; },
              configurable: true,
              enumerable: true
            });
          }
        } catch (e) {
          console.warn('Fetch setter patch notice:', e);
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
